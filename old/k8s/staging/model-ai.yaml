apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-ai
  template:
    metadata:
      labels:
        app: model-ai
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: model-ai
          image: registry.gitlab.com/bmci/chatbotai/model-ai:0.2-SNAPSHOT
          env:
            - name: MYSQL_HOST
              value: mysql-chatbot
            - name: MYSQL_USER
              value: chatbot
            - name: MYSQL_DATABASE
              value: chatbot
            - name: MYSQL_PASSWORD
              value: chatbot
            - name: MYSQL_PORT
              value: "3306"
            - name: QDRANT_URL
              value: "http://104.248.111.100:6333"
            - name: QDRANT_KEY
              value: "5DuEHW250wtYkpBWuIRD_j7ZLGObYBjmAa3SW6CRE3GtoWLDhg9wxA"
            - name: OPENAI_API_KEY
              value: "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"
          ports:
            - containerPort: 5002
