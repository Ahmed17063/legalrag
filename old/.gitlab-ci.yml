stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "registry.gitlab.com/bmci/chatbotai/model-ai"
  KUBE_CONFIG_STAGING: "$KUBE_CONFIG_STAGING"

.build-image: &build-image
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Starting Docker login process"
    - echo "$DOCKER_REGISTRY_SECRET" | docker login registry.gitlab.com -u "elhadjmohamedou" --password-stdin
    - echo "Docker login completed with exit code $?"
  script:
    - echo "Building Docker image"
    - echo "Current directory contents:"
    - ls -la
    - export IMGTAG=$(git ls-files -s . | git hash-object --stdin)
    - echo "Generated image tag $IMGTAG"
    - docker build -t $IMAGE_NAME:$IMGTAG .
    - echo "Docker build completed with exit code $?"
    - echo "Pushing Docker image to registry"
    - docker push $IMAGE_NAME:$IMGTAG
    - echo "Docker push completed with exit code $?"
    - echo "Full build process completed"

.deploy_template: &deploy_template
  stage: deploy
  image: alpine/k8s:1.26.6
  before_script:
    - apk add --no-cache git
    - mkdir -p ~/.kube/
    - echo "${KUBE_CONFIG_STAGING}" | base64 -d > ~/.kube/config
  script:
    - export TAG_CHATBOT=$(git ls-files -s . | git hash-object --stdin)
    - cd k8s/staging
    - kustomize edit set image $IMAGE_NAME=$IMAGE_NAME:$TAG_CHATBOT
    - cat kustomization.yaml
    - kustomize build . > deploy.yaml
    - kubectl apply -f deploy.yaml

build-chatbot-service:
  <<: *build-image
  rules:
    - if: '$CI_COMMIT_BRANCH == "cicd"'
    - if: '$CI_COMMIT_TAG != null'

deploy_chatbot-service:
  <<: *deploy_template
  rules:
    - if: '$CI_COMMIT_BRANCH == "cicd"'
    - if: '$CI_COMMIT_TAG != null'
