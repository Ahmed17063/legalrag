[project]
name = "legalrag"
version = "0.1.0"
description = "RAG sur un corpus juridique francais : Drive, embeddings, Qdrant, reponses sourcees"
requires-python = ">=3.11"

dependencies = [
    # --- Socle : HTTP, reessais, configuration -------------------------------
    "requests>=2.32,<3",
    "tenacity>=9.0,<10",
    "python-dotenv>=1.0",

    # --- Base vectorielle, interrogee par le reseau --------------------------
    "qdrant-client>=1.12",

    # --- Generation : Claude. Groq est appele en HTTP direct (API compatible
    #     OpenAI), Anthropic par son SDK officiel. Le serveur web propose les
    #     deux : la dependance appartient donc au socle, pas a l'indexation.
    "anthropic>=1.5,<2",

    # --- Interface web -------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Declare explicitement bien que FastAPI l'entraine : dependre d'une
    # transitive est fragile, une version majeure pourrait la changer.
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Tout ce qui ne sert qu'a fabriquer l'index : lecture de Drive, extraction
# de PDF, ecriture Parquet, tokenizer exact. Le serveur web n'en a aucun
# besoin — il interroge Qdrant par le reseau — et l'image Docker s'en
# trouve sensiblement allegee.
#
#     uv sync --extra indexation
indexation = [
    "pyarrow>=17.0",
    "pypdf>=6.0",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "voyageai>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Les tests couvrent l'indexation : le groupe de developpement tire
    # l'extra, pour qu'un `uv sync --all-groups` suffise.
    "legalrag[indexation]",
]

[project.scripts]
# Rend la commande disponible directement : `uv run legalrag ask "..."`
legalrag = "legalrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# La page du chatbot est servie depuis le paquet installe.
legalrag = ["web/static/*"]

[tool.uv]
# Le paquet lui-meme est installe en mode editable par `uv sync` : les
# modifications de src/ sont prises en compte sans reinstallation.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
