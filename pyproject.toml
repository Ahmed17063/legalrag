[project]
name = "legalrag"
version = "0.1.0"
description = "RAG sur un corpus juridique francais : Drive, embeddings, Qdrant, reponses sourcees"
requires-python = ">=3.11"

dependencies = [
    # --- Socle : HTTP, reessais, configuration -------------------------------
    "requests>=2.32,<3",
    "tenacity>=9.0,<10",
    "python-dotenv>=1.0",

    # --- Index sur disque ----------------------------------------------------
    "pyarrow>=17.0",

    # --- Ingestion de PDF ----------------------------------------------------
    "pypdf>=6.0",

    # --- Google Drive (compte de service, lecture seule) ---------------------
    "google-api-python-client>=2.140",
    "google-auth>=2.34",

    # --- Tokenizer exact Voyage. Sans lui, le comptage de tokens retombe sur
    #     une heuristique plus prudente : le job tourne, avec plus de marge.
    "voyageai>=0.3.2",

    # --- Base vectorielle ----------------------------------------------------
    "qdrant-client>=1.12",

    # --- Interface web -------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Declare explicitement bien que FastAPI l'entraine : dependre d'une
    # transitive est fragile, une version majeure pourrait la changer.
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
# Rend la commande disponible directement : `uv run legalrag ask "..."`
legalrag = "legalrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# La page du chatbot est servie depuis le paquet installe.
legalrag = ["web/static/*"]

[tool.uv]
# Le paquet lui-meme est installe en mode editable par `uv sync` : les
# modifications de src/ sont prises en compte sans reinstallation.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
